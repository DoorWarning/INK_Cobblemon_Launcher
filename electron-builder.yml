appId: club.ink.launcher
productName: Ink Launcher
directories:
  output: dist
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,mjs,ts}"
  - "!tsconfig*.json"
  - "!scripts/*"
  - "!mods/*"
  - "!resources/*"
  - "!manifest/*"
  - "!m.md"
  - "!README.md"
extraResources:
  - from: manifest/manifest.json
    to: manifest.json
  - from: build/icon.ico
    to: icon.ico
asar: true
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Ink Launcher
